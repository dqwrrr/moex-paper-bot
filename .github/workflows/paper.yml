name: Бумажная торговля
on:
  schedule:
    - cron: "*/30 6-20 * * 1-5"   # каждые 30 мин, 09:00–23:59 МСК, пн–пт
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Кэш рыночных данных
        uses: actions/cache@v4
        with:
          path: data
          key: moex-data-${{ github.run_id }}
          restore-keys: moex-data-
      - name: Получить состояние портфелей (ветка live)
        run: |
          if git ls-remote --exit-code --heads origin live >/dev/null; then
            git fetch --depth 1 origin live
            git worktree add live origin/live
          else
            git worktree add --detach live
            (cd live && git checkout --orphan live-new && git rm -rfq .)
          fi
      - name: Тик бота
        run: python -m tradebot.runner tick --state live
      - name: Сохранить состояние и сайт
        run: |
          cp dashboard/index.html live/index.html
          touch live/.nojekyll
          cd live
          git config user.name "paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "tick $(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M') МСК" || exit 0
          git push -q origin HEAD:refs/heads/live
