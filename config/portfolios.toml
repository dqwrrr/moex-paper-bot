# Виртуальные портфели. Деньги не реальные, котировки — реальные (MOEX ISS, задержка ~15 мин).

[risk]
dd_limit = 0.20          # стоп-кран: просадка от пика больше 20% → денежный рынок
cooldown_days = 21       # на сколько торговых дней
withdraw_trigger = 0.15  # рекомендовать вывод, если капитал вырос на 15% с прошлой отметки
withdraw_share = 0.5     # выводить 50% прибыли сверх отметки
withdraw_freq = "QE"     # проверка раз в квартал

[session]
summary_times = ["12:00", "15:00", "18:45", "23:45"]   # сводки (МСК) — в ленту и Telegram

[[portfolio]]
id = "crypto"
title = "Крипто: BTC 24/7"
note = "Бумажный. Биткоин против USDT по часовым свечам, круглосуточно, без плеча. Стратегия будет выбрана по итогам исследования."
kind = "crypto"
symbol = "BTCUSDT"
strategy = "sma_cross"            # временно; заменим лучшей по исследованию
params = { fast = 24, slow = 120 }
capital = 10                      # USDT — как будущий реальный капитал
body = 10
withdraw_min_profit = 0.05        # выводить прибыль сверх тела, если она ≥ 5%
daily_loss_limit = 0.05           # −5% за день → до конца дня в USDT
comment_every_min = 5

[[portfolio]]
id = "active"
title = "Активный: сделки внутри дня (TMOS)"
note = "Эксперимент. Торгует фондом на индекс по 10-минутным свечам, к закрытию дня — вне рынка. Прибыль сверх «тела» рекомендуется выводить."
kind = "intraday"
strategy = "sma_cross"            # будет заменена лучшей по итогам исследования
params = { fast = 6, slow = 30 }
capital = 1000
body = 1000                       # «тело»: с ним бот продолжает торговать после вывода прибыли
withdraw_min_profit = 0.02        # выводить, если прибыль сверх тела ≥ 2%
daily_loss_limit = 0.03           # −3% за день → до конца дня вне рынка
comment_every_min = 5

[[portfolio]]
id = "defensive"
title = "Долгосрочный: индекс ↔ денежный рынок"
note = "Главный кандидат для реальных денег: работает от ~1 000 ₽, фонды Т-Капитала без комиссии брокера."
strategy = "index_sma"
params = { n = 150 }
capital = 1000

# Моментум акций выключен: провалился на проверке 2021–2026 (−14% в год, просадка −65%). См. docs/research-report.md
